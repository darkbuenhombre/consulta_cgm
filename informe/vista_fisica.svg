<polyline points="492,304 492,399 510,399" fill="none" stroke="#333" stroke-width="1.6" stroke-dasharray="6,5" marker-end="url(#f)"/>
<text x="40" y="640" text-anchor="start" font-size="14" fill="#333" stroke="#fff" stroke-width="4" paint-order="stroke">Despliegue propuesto para la puesta en marcha: el proveedor de hosting aún no está definido. Separa el servidor de aplicación del servidor de base de datos.</text>
<text x="40" y="664" text-anchor="start" font-size="14" fill="#333" stroke="#fff" stroke-width="4" paint-order="stroke">Detrás de Nginx, la API debe activar app.set(&quot;trust proxy&quot;, 1) para que el límite de intentos identifique la IP real de cada usuario.</text>
<text x="40" y="688" text-anchor="start" font-size="14" fill="#333" stroke="#fff" stroke-width="4" paint-order="stroke">En el ambiente de desarrollo, todos los componentes se ejecutan en un solo equipo (React en el puerto 3000, API en el 4000 y PostgreSQL local).</text>
</svg>